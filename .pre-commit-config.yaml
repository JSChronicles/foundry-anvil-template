repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 4f783b6470be305483837130a5be2e21ed7ff52b # 0.12.13
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: e8f7d69b957a30acb2c875078d5fd012de24b64c # v0.16.7
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
