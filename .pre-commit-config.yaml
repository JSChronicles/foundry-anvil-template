repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db # 0.13.1
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
