repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: c665864e22f27255a10d82e14f8ccea6843fd65e # 0.11.19
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 22f0422809455ec89ffdcf5a00170ba816e42ddb # v0.15.16
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
