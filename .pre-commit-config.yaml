repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: b17b79c1cab56c3d1025ad36cb117fe602e570fd # 0.11.23
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 77039ccbba72c8aede339c5f8ae29b42aced0a2e # v0.15.18
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
