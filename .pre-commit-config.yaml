repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: d1df990f871e616da38bb602a2671d5e840b9989 # 0.13.7
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # v0.17.4
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
