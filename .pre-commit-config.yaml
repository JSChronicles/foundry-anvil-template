repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 2aeb804518b4373dbf5adb8dddc5466d9a6e6b21 # 0.12.19
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # v0.16.9
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
