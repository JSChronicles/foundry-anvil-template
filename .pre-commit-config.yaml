repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 2e145a365871c9fef3715d38b9b7393ce4174c85 # 0.13.0
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # v0.17.0
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
