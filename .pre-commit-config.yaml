repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: fc310cf5c89c3772bdfae0073eeb2f200b6118bb # 0.11.25
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56 # v0.15.20
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
