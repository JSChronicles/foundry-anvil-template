repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 00eaed0068329eb6ca6bcb8de7b46c372d8d1c19 # 0.13.9
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # v0.17.6
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
