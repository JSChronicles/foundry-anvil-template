repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0f34924c4110aca2294a4e4204aac7b3e31803fb # 0.12.7
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49 # v0.16.5
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
