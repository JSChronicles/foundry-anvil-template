repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: b9d5257d60a86c20fd9a3919d548e08ba5ab905b # 0.13.8
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
