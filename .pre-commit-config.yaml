repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: eeca16c54e09b4d9a848259e46bae14737944348 # 0.13.5
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # v0.17.2
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
