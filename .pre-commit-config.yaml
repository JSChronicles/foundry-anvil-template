  rev: 17a6b18b8006d390e476d419631aae885cadfa40 # 0.12.17
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # v0.16.8
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format
