[build-system]
requires = ["uv_build>=0.11.19,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["tasks", "processors"]
module-root = ""

[project]
name = "foundry-anvil-template"
version = "0.6.1"
description = "Starter template for building project-local Anvil tasks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  # anvil v0.29.1
  "anvil @ git+https://github.com/JSChronicles/anvil.git@cfad98d35532c1091501789b8d5b22138b879b85",
]

[project.entry-points."anvil.tasks"]
foundry_anvil_template = "tasks"

[project.entry-points."anvil.processors"]
foundry_anvil_template = "processors"

[dependency-groups]
dev = [
  "prek>=0.4.4,<0.5.0",
  "check-jsonschema>=0.37.2,<0.40.0",
  "ruff>=0.15.16,<0.20.0",
  "ty>=0.0.40,<0.20.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true
