[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tasks"
module-root = ""

[project]
name = "foundry-anvil-template"
version = "0.1.0"
description = "Starter template for building project-local Anvil tasks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  # anvil v0.22.0
  "anvil @ git+https://github.com/JSChronicles/anvil.git@5e2882f2a975ed83622a2a0d1ae01ace10bd95e4",
]

[project.entry-points."anvil.tasks"]
foundry_anvil_template = "tasks"

[dependency-groups]
dev = [
  "prek>=0.3.10,<0.4.0",
  "check-jsonschema>=0.37.1,<0.40.0",
  "ruff>=0.15.12,<0.20.0",
]

[tool.ruff]
# https://docs.astral.sh/ruff/settings/
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
ignore = []
task-tags = ["TODO", "FIXME", "HACK"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
