[build-system]
requires = ["uv_build>=0.11.16,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tasks"
module-root = ""

[project]
name = "foundry-anvil-template"
version = "0.4.0"
description = "Starter template for building project-local Anvil tasks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  # anvil v0.25.0
  "anvil @ git+https://github.com/JSChronicles/anvil.git@3d60bb2ae8b3495d31a2e458eba7006d393659d8",
]

[project.entry-points."anvil.tasks"]
foundry_anvil_template = "tasks"

[project.entry-points."anvil.processors"]
foundry_anvil_template = "processors"

[dependency-groups]
dev = [
  "prek>=0.4.1,<0.5.0",
  "check-jsonschema>=0.37.2,<0.40.0",
  "ruff>=0.15.14,<0.20.0",
  "ty>=0.0.40,<0.20.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true
