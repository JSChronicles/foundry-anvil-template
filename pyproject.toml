[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["tasks", "processors"]
module-root = ""

[project]
name = "foundry-anvil-template"
version = "0.6.3"
description = "Starter template for building project-local Anvil tasks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  # anvil v0.30.1
  "anvil @ git+https://github.com/JSChronicles/anvil.git@4120fb4e4b70bfd46efb4b12abf07275319d0e50",
]

[project.entry-points."anvil.providers.tasks"]
foundry_anvil_template = "tasks.universal"

[project.entry-points."anvil.providers.aws.tasks"]
foundry_anvil_template = "tasks.aws"

[project.entry-points."anvil.providers.azure.tasks"]
foundry_anvil_template = "tasks.azure"

[project.entry-points."anvil.providers.gcp.tasks"]
foundry_anvil_template = "tasks.gcp"

[project.entry-points."anvil.providers.github.tasks"]
foundry_anvil_template = "tasks.github"

[project.entry-points."anvil.processors"]
foundry_anvil_template = "processors"

[dependency-groups]
dev = [
  "prek>=0.4.11,<0.5.0",
  "check-jsonschema>=0.37.4,<0.40.0",
  "ruff>=0.16.0,<0.20.0",
  "ty>=0.0.63,<0.20.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true
