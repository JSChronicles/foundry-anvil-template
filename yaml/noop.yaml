# Starter Anvil configuration for this template repository.
#
# Edit provider.options, regions, and optional metadata for your environment,
# then validate the configuration and run a dry-run.

schema_version: 2

targets:
  - name: starter-org
    provider:
      name: aws
      mode: organization
      options:
        profile: my-aws-profile
        role_name: OrganizationAccountAccessRole
    regions:
      - us-east-1
    max_workers: 10
    dry_run: true
    tasks:
      - name: noop
    metadata:
      owner: platform-engineering
