# Starter Anvil configuration for this template repository.
#
# Edit the profile, regions, role_name, and optional metadata for your environment,
# then validate task discovery and run a dry-run.

schema_version: 1

organizations:
  - name: starter-org
    profile: my-aws-profile
    regions:
      - us-east-1
    role_name: OrganizationAccountAccessRole
    max_workers: 10
    dry_run: true
    tasks:
      - name: noop
    metadata:
      owner: platform-engineering
