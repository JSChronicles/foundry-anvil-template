name: Test setup-anvil

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Anvil
        id: setup-anvil
        uses: JSChronicles/setup-anvil@b825f588866bd49af091c3f876de2b82a70ba586

      - name: Verify setup
        shell: bash
        env:
          ANVIL_VERSION: ${{ steps.setup-anvil.outputs.anvil-version }}
        run: |
          echo "Installed Anvil ${ANVIL_VERSION}"
          anvil validate --tasks
          anvil list --tasks setup_anvil_smoke --detail
          anvil list --processors

      - name: Validate template
        run: anvil validate --config-file yaml/noop.yaml
